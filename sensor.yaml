esphome:
  name: sensor-node

esp32:
  board: firebeetle32
  framework:
    type: arduino

logger:
  level: DEBUG

external_components:
  - source:
      type: git
      url: https://github.com/gwlsn/espnowmqtt
      ref: master
    refresh: 0s
    components: [now_mqtt]

# No wifi: block — this node is ESP-NOW only
now_mqtt:
  wifi_channel: 1           # Must match your 2.4GHz AP channel
  long_range_mode: true     # Optional, default true
  on_send_failure:
    - logger.log: "Send failed after retries"

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: "Temperature"
      filters:
        - offset: -4.5
    humidity:
      name: "Humidity"

  - platform: adc
    pin: GPIO34
    name: "Battery"
    device_class: battery
    unit_of_measurement: "%"
    attenuation: 11db
    filters:
      - multiply: 2.0  # Voltage divider ratio on FireBeetle
      - calibrate_linear:
          - 3.0 -> 0.0
          - 4.2 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

deep_sleep:
  run_duration: 10s
  sleep_duration: 2h